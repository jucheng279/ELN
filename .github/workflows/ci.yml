name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify migrations exist
        run: |
          count=$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "$count migration files found"
          if [ "$count" -lt 1 ]; then echo "No migration files found" && exit 1; fi

      - name: Production build
        run: npm run build
